commands.allow = [
  "list_accounts",
  "get_account",
  "account_sign_in",
  "account_sign_out",
  "account_clear_local_data",
  "update_display_settings",
  "get_account_change_version",
  "update_account_aliases",
  "list_contacts",
  "get_contact",
  "get_contact_by_address",
  "list_sessions",
  "get_session",
  "list_session_messages",
  "list_pending_sends",
  "hide_session",
  "get_message",
  "ensure_message_body",
  "mark_messages_read",
  "delete_messages",
  "move_message_junk",
  "list_groups",
  "get_group",
  "list_group_participants",
  "get_mail_sync_progress",
  "trigger_mail_sync",
  "refresh_mail_folders",
  "set_folder_sync_enabled",
  "set_folder_junk_override",
  "trigger_contact_sync",
  "get_contact_sync_progress",
  "upsert_imap_smtp_account",
  "ensure_private_session",
  "ensure_group_session",
  "create_manual_group",
  "rename_group",
  "hide_group",
  "merge_sessions",
  "reassign_messages",
  "update_group_send_members",
