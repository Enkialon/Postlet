name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 先于 pnpm；不要用 setup-node 的 cache:pnpm（store path 易失败）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本地 / packageManager 一致（lockfileVersion 9 需 pnpm 10+）
          version: 11
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Postlet ${{ steps.meta.outputs.tag }}
          releaseBody: |
            ## Postlet 1.0.0

            Contact- and conversation-first desktop mail client (Tauri 2).

            ### Highlights
            - Conversation-first UI (contacts / sessions)
            - Microsoft Graph (Outlook) and IMAP + SMTP
            - Opt-in folder sync after sign-in
            - Soft-delete mail, hide sessions without wiping history
            - Licensed under **GPL-3.0-only**

            ### Downloads
            - **Windows**: `.msi` / `.exe` (NSIS)
            - **macOS**: Apple Silicon (aarch64) and Intel (x86_64) bundles

            Installers are attached below once the workflow finishes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
